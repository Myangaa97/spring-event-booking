<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - KiloE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-box">
            <!-- Logo -->
            <div class="auth-brand">
                <a href="/" class="brand" style="justify-content: center;">
                    <div class="brand-logo">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>
                        </svg>
                    </div>
                    <span class="brand-name">Kilo<span>E</span></span>
                </a>
                <p>Create a new user account</p>
            </div>

            <!-- Register Form -->
            <div class="auth-card">
                <form th:action="@{/register}" method="post" id="registerForm">
                    <div th:if="${error}" class="alert alert-error" th:text="${error}">Error</div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" id="firstName" name="firstName" required maxlength="50"
                                   class="form-control" placeholder="First Name"
                                   th:value="${registerRequest?.firstName}">
                        </div>
                        <div class="form-group">
                            <label for="lastName" class="form-label">Name</label>
                            <input type="text" id="lastName" name="lastName" required maxlength="50"
                                   class="form-control" placeholder="Name"
                                   th:value="${registerRequest?.lastName}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <div class="input-icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                            </svg>
                            <input type="email" id="email" name="email" required
                                   class="form-control" placeholder="you@example.com"
                                   th:value="${registerRequest?.email}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-icon input-icon-right">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                            <input type="password" id="password" name="password" required minlength="6"
                                   class="form-control" placeholder="Minimum 6 characters">
                            <button type="button" onclick="togglePassword()" class="input-eye">
                                <svg id="eyeIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                        <p id="passwordHint" class="form-hint hidden">Minimum 6 characters required</p>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="input-icon">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                            </svg>
                            <input type="password" id="confirmPassword" name="confirmPassword" required
                                   class="form-control" placeholder="Confirm your password">
                        </div>
                        <p id="matchHint" class="form-hint hidden"></p>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">
                        Sign Up
                    </button>
                </form>

                <div class="auth-switch">
                    <p>Already have an account?
                        <a th:href="@{/login}" href="login.html">Sign In</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>';
            }
        }

        // Password match validation
        const password = document.getElementById('password');
        const confirm = document.getElementById('confirmPassword');
        const matchHint = document.getElementById('matchHint');

        confirm.addEventListener('input', () => {
            if (confirm.value === '') {
                matchHint.classList.add('hidden');
            } else if (confirm.value === password.value) {
                matchHint.textContent = 'Passwords match';
                matchHint.className = 'form-hint ok';
            } else {
                matchHint.textContent = 'Passwords do not match';
                matchHint.className = 'form-hint bad';
            }
        });
    </script>
</body>
</html>
