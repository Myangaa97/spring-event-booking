<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | KiloE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../static/css/style.css">
</head>
<body>
    <main class="section" style="min-height: calc(100vh - 80px); display: flex; align-items: center;">
        <div class="container" style="text-align: center; max-width: 560px;">
            <p style="font-size: 120px; font-weight: 800; line-height: 1; color: var(--gray-200); margin: 0;">404</p>
            <h1 class="section-title" style="margin-top: 8px;">Page Not Found</h1>
            <p class="section-subtitle">Уучлаарай, таны хайсан хуудас олдсонгүй эсвэл зөөгдсөн байж болно.</p>
            <div style="display: flex; gap: 12px; justify-content: center; margin-top: 24px;">
                <a th:href="@{/}" href="/" class="btn btn-primary">Go Home</a>
                <a th:href="@{/events}" href="/events" class="btn btn-secondary">Browse Events</a>
            </div>
        </div>
    </main>
</body>
</html>
