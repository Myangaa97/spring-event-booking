<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - KiloE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-inner">
                <a th:href="@{/}" href="/" class="brand">
                    <div class="brand-logo">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
                    </div>
                    <span class="brand-name">Kilo<span>E</span></span>
                </a>
                <div class="nav-links">
                    <a th:href="@{/}" class="nav-link">Home</a>
                    <a th:href="@{/events}" class="nav-link">Events</a>
                </div>
                <div class="nav-actions">
                    <a th:href="@{/customer/dashboard}" class="btn btn-outline">Dashboard</a>
                    <a th:href="@{/logout}" class="btn btn-secondary">Sign Out</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main>
        <div class="container section" style="padding-top: 32px;">
            <!-- Header -->
            <div class="page-header-flex">
                <div>
                    <h1 class="page-title">My Bookings</h1>
                    <p class="page-subtitle">Manage all your event reservations</p>
                </div>
                <a th:href="@{/events}" class="btn btn-accent btn-sm" style="padding: 10px 20px;">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                    Browse Events
                </a>
            </div>

            <!-- Stats Bar -->
            <div class="mini-stats">
                <div class="mini-stat">
                    <p class="mini-stat-value" id="statTotal">0</p>
                    <p class="mini-stat-caption">Total Bookings</p>
                </div>
                <div class="mini-stat yellow">
                    <p class="mini-stat-value" id="statPending">0</p>
                    <p class="mini-stat-caption">Pending</p>
                </div>
                <div class="mini-stat green">
                    <p class="mini-stat-value" id="statConfirmed">0</p>
                    <p class="mini-stat-caption">Confirmed</p>
                </div>
                <div class="mini-stat red">
                    <p class="mini-stat-value" id="statCancelled">0</p>
                    <p class="mini-stat-caption">Cancelled</p>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="tab-filters">
                <button data-tab="all" class="chip active">All (0)</button>
                <button data-tab="PENDING" class="chip">Pending (0)</button>
                <button data-tab="CONFIRMED" class="chip">Confirmed (0)</button>
                <button data-tab="CANCELLED" class="chip">Cancelled (0)</button>
            </div>

            <!-- Bookings List -->
            <div id="bookingsList" style="display: flex; flex-direction: column; gap: 12px;"></div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state hidden">
                <div class="empty-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
                </div>
                <h3>No bookings found</h3>
                <p>You haven't booked any events yet.</p>
                <a th:href="@{/events}" class="btn btn-primary">Browse Events</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"><p>&copy; 2026 KiloE. All rights reserved.</p></div>
        </div>
    </footer>

    <script th:src="@{/js/customer-bookings.js}" src="../../static/js/customer-bookings.js"></script>
</body>
</html>
