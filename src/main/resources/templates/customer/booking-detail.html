<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Details - KiloE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-inner">
                <a th:href="@{/}" href="/" class="brand">
                    <div class="brand-logo">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
                    </div>
                    <span class="brand-name">Kilo<span>E</span></span>
                </a>
                <div class="nav-links">
                    <a th:href="@{/}" class="nav-link">Home</a>
                    <a th:href="@{/events}" class="nav-link">Events</a>
                </div>
                <div class="nav-actions">
                    <a th:href="@{/customer/dashboard}" class="btn btn-outline">Dashboard</a>
                    <a th:href="@{/logout}" class="btn btn-secondary">Sign Out</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main>
        <div class="container section" style="padding-top: 32px; max-width: 768px;">
            <a th:href="@{/customer/bookings}" class="back-link">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                Back to My Bookings
            </a>

            <div class="panel" style="padding: 0; overflow: hidden;">
                <img th:if="${booking.event.imageUrl != null}" th:src="${booking.event.imageUrl}"
                     th:alt="${booking.event.title}" class="modal-image"
                     style="height: 220px;" onerror="this.style.display='none'">

                <div class="modal-body">
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;">
                        <span class="badge badge-yellow" th:text="${booking.event.category.name}">Category</span>
                        <span class="badge" th:classappend="'status-' + ${booking.status}" th:text="${booking.status}">CONFIRMED</span>
                    </div>

                    <h1 class="modal-title" th:text="${booking.event.title}">Event Title</h1>
                    <p style="color: var(--gray-500); font-size: 14px; margin-bottom: 24px;">
                        Booking ID:
                        <span style="font-weight: 700; color: var(--gray-800);"
                              th:text="'KiloE-' + ${#numbers.formatInteger(booking.id + 1000, 4)}">#1000</span>
                    </p>

                    <div class="two-col" style="margin-bottom: 24px;">
                        <div class="info-box">
                            <p class="info-label">Date / Time</p>
                            <p class="info-value" th:text="${booking.event.eventDate}">2026-09-15</p>
                            <p class="info-sub"><span th:text="${booking.event.startTime}">19:00</span> цагаас</p>
                        </div>
                        <div class="info-box">
                            <p class="info-label">Venue</p>
                            <p class="info-value" th:text="${booking.event.venue.name}">Venue</p>
                            <p class="info-sub" th:text="${booking.event.venue.address}">Address</p>
                        </div>
                    </div>

                    <div class="info-box" style="margin-bottom: 8px;">
                        <div style="display: flex; justify-content: space-between; padding: 6px 0;">
                            <span class="page-subtitle">Tickets</span>
                            <span class="info-value" th:text="${booking.ticketQuantity}">2</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; padding: 6px 0;">
                            <span class="page-subtitle">Price per ticket</span>
                            <span class="info-value"
                                  th:text="${#numbers.formatDecimal(booking.unitPrice, 1, 0, 'COMMA') + ' ₮'}">50,000 ₮</span>
                        </div>
                        <hr style="border: none; border-top: 1px solid var(--gray-200); margin: 10px 0;">
                        <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 0;">
                            <span class="info-value" style="font-size: 16px;">Total</span>
                            <span class="total-price"
                                  th:text="${#numbers.formatDecimal(booking.unitPrice * booking.ticketQuantity, 1, 0, 'COMMA') + ' ₮'}">100,000 ₮</span>
                        </div>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;">
                        <a th:href="@{'/events/' + ${booking.event.id}}" class="btn btn-secondary">View Event</a>
                        <button th:if="${booking.status.name() == 'CONFIRMED' or booking.status.name() == 'PENDING'}"
                                onclick="cancelBooking(this)" th:data-id="${booking.id}"
                                class="btn btn-danger">Cancel Booking</button>
                    </div>

                    <div id="cancelMsg" class="alert alert-success hidden" style="margin-top: 16px;">Booking cancelled.</div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"><p>&copy; 2026 KiloE. All rights reserved.</p></div>
        </div>
    </footer>

    <script>
        async function cancelBooking(btn) {
            const id = btn.dataset.id;
            if (!confirm("Are you sure you want to cancel this booking?")) return;
            const res = await fetch('/api/bookings/' + id, { method: 'DELETE' });
            if (res.ok) {
                document.getElementById('cancelMsg').classList.remove('hidden');
                setTimeout(() => window.location.reload(), 900);
            } else {
                alert('Could not cancel booking');
            }
        }
    </script>
</body>
</html>
