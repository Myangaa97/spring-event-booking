<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - KiloE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-inner">
                <a href="/" class="brand">
                    <div class="brand-logo">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/></svg>
                    </div>
                    <span class="brand-name">Kilo<span>E</span></span>
                </a>
                <div class="nav-links">
                    <a th:href="@{/}" href="/" class="nav-link">Home</a>
                    <a th:href="@{/events}" href="events.html" class="nav-link active">Events</a>
                </div>
                <div class="nav-actions">
                    <th:block sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" href="login.html" class="btn btn-secondary">Sign In</a>
                        <a th:href="@{/register}" href="register.html" class="btn btn-primary">Sign Up</a>
                    </th:block>
                    <th:block sec:authorize="isAuthenticated()">
                        <span sec:authentication="name" style="font-size: 14px; color: var(--text-muted, #64748b);">user@example.com</span>
                        <a th:href="@{/customer/dashboard}" class="btn btn-outline">Dashboard</a>
                        <a th:href="@{/logout}" class="btn btn-secondary">Sign Out</a>
                    </th:block>
                </div>
            </div>
        </div>
    </nav>

    <!-- HEADER -->
    <div class="page-header">
        <div class="container">
            <h1 class="page-title">Events</h1>
            <p class="page-subtitle">Browse all active events</p>
        </div>
    </div>

    <!-- FILTER + GRID -->
    <div class="container section" style="padding-top: 32px;">
        <div class="listing-toolbar">
            <div class="search-box" style="flex: 1;">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" id="searchInput" placeholder="Search events..." class="search-input">
            </div>
            <div class="chip-row" id="categoryFilters">
                <button data-category="all" class="chip active">All</button>
            </div>
        </div>

        <div class="grid-cards" id="eventsGrid"></div>

        <div id="emptyState" class="empty-state hidden">
            <div class="empty-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
            <p style="font-size: 18px;">No events found</p>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom"><p>&copy; 2026 KiloE. All rights reserved.</p></div>
        </div>
    </footer>

    <script th:src="@{/js/customer-events.js}" src="../../static/js/customer-events.js"></script>
</body>
</html>
