<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Categories - Admin | KiloE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>
    <div class="admin-layout">

        <div th:replace="~{admin/fragments :: sidebar('categories')}"></div>

        <div class="main-content">
            <header class="admin-topbar" style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
                <h1>Manage Categories</h1>
                <button onclick="showForm()" class="btn btn-primary btn-sm" style="padding: 10px 18px;">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    New Category
                </button>
            </header>

            <div class="admin-content">
                <!-- INLINE FORM -->
                <div id="formSection" class="hidden" style="margin-bottom: 24px;">
                    <div class="panel">
                        <div class="table-toolbar">
                            <h2 class="panel-title" style="margin-bottom: 0;" id="formTitle">New Category</h2>
                            <button onclick="hideForm()" class="btn btn-secondary btn-sm">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                        <form id="categoryForm">
                            <input type="hidden" id="editId" value="">
                            <div class="form-group">
                                <label class="form-label">Category Name</label>
                                <input type="text" id="fName" required maxlength="100" class="form-control" placeholder="e.g. Concert">
                            </div>
                            <div style="display: flex; gap: 12px;">
                                <button type="submit" class="btn btn-primary">Save Category</button>
                                <button type="button" onclick="hideForm()" class="btn btn-secondary">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Table -->
                <div class="panel" style="padding: 0; overflow: hidden;">
                    <div class="table-wrap">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th style="text-align: right;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="categoriesTableBody"></tbody>
                        </table>
                    </div>
                    <div id="emptyTable" class="empty-state hidden"><h3>No categories found</h3></div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin-categories.js}" src="../../static/js/admin-categories.js"></script>
</body>
</html>
