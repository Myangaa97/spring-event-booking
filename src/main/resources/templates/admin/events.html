<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events - Admin | KiloE</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="../../static/css/style.css">
</head>
<body>
    <div class="admin-layout">

        <div th:replace="~{admin/fragments :: sidebar('events')}"></div>

        <div class="main-content">
            <header class="admin-topbar" style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
                <h1>Manage Events</h1>
                <button onclick="showForm()" id="btnNew" class="btn btn-primary btn-sm" style="padding: 10px 18px;">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    New Event
                </button>
            </header>

            <div class="admin-content">
                <!-- INLINE FORM (hidden by default) -->
                <div id="formSection" class="hidden" style="margin-bottom: 24px;">
                    <div class="panel">
                        <div class="table-toolbar">
                            <h2 class="panel-title" style="margin-bottom: 0;" id="formTitle">New Event</h2>
                            <button onclick="hideForm()" class="btn btn-secondary btn-sm">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                        <form id="eventForm" class="form-grid-2">
                            <input type="hidden" id="editId" value="">
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label class="form-label">Event Title</label>
                                <input type="text" id="fTitle" required class="form-control">
                            </div>
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label class="form-label">Description</label>
                                <textarea id="fDesc" rows="2" class="form-control"></textarea>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Date</label>
                                <input type="date" id="fDate" required class="form-control">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Start Time</label>
                                <input type="time" id="fTime" required class="form-control">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Category</label>
                                <select id="fCategory" required class="form-control"></select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Venue</label>
                                <select id="fVenue" required class="form-control"></select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Ticket Price (MNT)</label>
                                <input type="number" id="fPrice" required min="0" class="form-control">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Total Tickets</label>
                                <input type="number" id="fTickets" required min="1" class="form-control">
                            </div>
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label class="form-label">Event Image</label>
                                <div style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap;">
                                    <img id="imagePreview" alt="Event image" src=""
                                        style="width: 180px; height: 100px; object-fit: cover; border-radius: 8px; border: 1px solid var(--gray-200); background: var(--gray-100);">
                                    <div style="flex: 1; min-width: 220px;">
                                        <input type="file" id="fImage" accept="image/*" class="form-control">
                                        <input type="hidden" id="fImageUrl" value="">
                                        <small id="imageStatus" style="color: var(--gray-500); font-size: 13px;"></small>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label class="checkbox-row">
                                    <input type="checkbox" id="fPublished">
                                    <span style="font-weight: 600; color: var(--gray-700);">Published</span>
                                </label>
                            </div>
                            <div style="grid-column: 1 / -1; display: flex; gap: 12px;">
                                <button type="submit" class="btn btn-primary">Save Event</button>
                                <button type="button" onclick="hideForm()" class="btn btn-secondary">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Stats -->
                <div class="mini-stats">
                    <div class="mini-stat">
                        <p class="mini-stat-value" id="totalCount" style="color: var(--gray-900);">0</p>
                        <p class="mini-stat-caption">Total Events</p>
                    </div>
                    <div class="mini-stat green">
                        <p class="mini-stat-value" id="publishedCount">0</p>
                        <p class="mini-stat-caption">Published</p>
                    </div>
                    <div class="mini-stat yellow">
                        <p class="mini-stat-value" id="draftCount">0</p>
                        <p class="mini-stat-caption">Draft</p>
                    </div>
                </div>

                <!-- Filter -->
                <div class="table-toolbar">
                    <input type="text" id="searchInput" placeholder="Search..." class="form-control" style="max-width: 260px;">
                    <select id="categoryFilter" class="form-control" style="max-width: 220px;">
                        <option value="all">All Categories</option>
                    </select>
                </div>

                <!-- Table -->
                <div class="panel" style="padding: 0; overflow: hidden;">
                    <div class="table-wrap">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Venue</th>
                                    <th>Price</th>
                                    <th>Tickets</th>
                                    <th>Status</th>
                                    <th style="text-align: right;">Action</th>
                                </tr>
                            </thead>
                            <tbody id="eventsTableBody"></tbody>
                        </table>
                    </div>
                    <div id="emptyTable" class="empty-state hidden"><h3>No events found</h3></div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/admin-events.js}" src="../../static/js/admin-events.js"></script>
</body>
</html>
